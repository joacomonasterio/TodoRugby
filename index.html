<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1c22">
  <meta name="color-scheme" content="dark">
  <title>TodoRugby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="brand-ball" viewBox="0 0 32 32" aria-hidden="true">
          <ellipse cx="16" cy="16" rx="14" ry="9" transform="rotate(-35 16 16)" fill="currentColor"/>
          <path d="M9.5 22.5 22.5 9.5M13 17l2 2M15.5 14.5l2 2M18 12l2 2" stroke="var(--brand)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Todo<b>Rugby</b></span>
      </div>
    </div>
  </header>

  <div id="vistaPartidos">
    <nav class="days" id="days" aria-label="Días"></nav>

    <div class="filters" id="filtros" hidden>
      <select id="canal" aria-label="Filtrar por canal">
        <option value="">Todos los canales</option>
      </select>
    </div>

    <main id="lista"></main>
  </div>

  <div id="vistaLiga" hidden>
    <main>
      <div class="liga-cab">
        <button type="button" id="volver" class="volver" aria-label="Volver a partidos">‹</button>
        <h1 id="ligaNombre"></h1>
      </div>
      <div id="ligaTabla"></div>
      <div id="ligaPartidos"></div>
    </main>
  </div>

  <footer class="foot">
    Datos en tiempo real desde ESPN, BBC Sport, World Rugby y TheSportsDB. Horarios en hora argentina. <span id="actualizado"></span><br>
    El canal se muestra solo cuando está confirmado oficialmente.
  </footer>

  <dialog id="detalle"></dialog>

  <script src="config.js"></script>
  <script src="datos-fijos.js"></script>
  <script src="app.js"></script>
  <script src="detalle.js"></script>
  <script src="tablas.js"></script>
</body>
</html>
